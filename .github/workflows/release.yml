name: Release

on:
  create:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set build flags
        id: flags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT=$(git rev-parse --short HEAD)
          echo "ldflags=-s -w -X github.com/liebeSonne/gophkeeper/cmd/server.version=$VERSION -X github.com/liebeSonne/gophkeeper/cmd/server.buildDate=$DATE -X github.com/liebeSonne/gophkeeper/cmd/server.commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="${{ steps.flags.outputs.ldflags }}"

          # Linux amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-server-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-client-linux-amd64 ./cmd/client

          # Linux arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-server-linux-arm64 ./cmd/server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-client-linux-arm64 ./cmd/client

          # macOS amd64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-server-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-client-darwin-amd64 ./cmd/client

          # macOS arm64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-server-darwin-arm64 ./cmd/server
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-client-darwin-arm64 ./cmd/client

          # Windows amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-server-windows-amd64.exe ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/gophkeeper-client-windows-amd64.exe ./cmd/client

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            dist/*
